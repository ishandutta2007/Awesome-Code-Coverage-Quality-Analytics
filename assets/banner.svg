<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: -1px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .metric-value {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      font-weight: 700;
      font-size: 22px;
      fill: #34d399;
    }
    .metric-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      font-size: 11px;
      fill: #64748b;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#cyberGrid)" />

  <!-- Animated Glowing Background Orbs (Behind content) -->
  <circle cx="150" cy="80" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)">
    <animate attributeName="cy" values="70;110;70" dur="8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.08;0.16;0.08" dur="8s" repeatCount="indefinite" />
  </circle>

  <circle cx="1050" cy="180" r="160" fill="#818cf8" opacity="0.1" filter="url(#glow)">
    <animate attributeName="cy" values="190;150;190" dur="10s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.07;0.14;0.07" dur="10s" repeatCount="indefinite" />
  </circle>

  <circle cx="650" cy="360" r="120" fill="#34d399" opacity="0.08" filter="url(#glow)">
    <animate attributeName="cx" values="640;690;640" dur="12s" repeatCount="indefinite" />
  </circle>

  <!-- Dynamic Scan Line Animation (Subtle background beam) -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#textGrad)" stroke-width="1.5" opacity="0.2">
    <animate attributeName="y1" values="0;420;0" dur="7s" repeatCount="indefinite" />
    <animate attributeName="y2" values="0;420;0" dur="7s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.05;0.35;0.05" dur="7s" repeatCount="indefinite" />
  </line>

  <!-- Animated Data Waves (Geometric background telemetry) -->
  <path d="M 0 350 Q 300 310 600 350 T 1200 350 L 1200 420 L 0 420 Z" fill="#0284c7" opacity="0.05">
    <animate attributeName="d"
      values="M 0 350 Q 300 310 600 350 T 1200 350 L 1200 420 L 0 420 Z;
              M 0 350 Q 300 390 600 340 T 1200 350 L 1200 420 L 0 420 Z;
              M 0 350 Q 300 310 600 350 T 1200 350 L 1200 420 L 0 420 Z"
      dur="9s" repeatCount="indefinite" />
  </path>

  <!-- FOREGROUND CONTENT: Header Category Tag -->
  <g transform="translate(80, 50)">
    <rect x="0" y="0" width="310" height="28" rx="14" fill="#0369a1" fill-opacity="0.25" stroke="#0284c7" stroke-width="1" />
    <circle cx="16" cy="14" r="5" fill="#38bdf8">
      <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="19" class="tagline">DEVSECOPS &amp; CODE INTELLIGENCE</text>
  </g>

  <!-- FOREGROUND CONTENT: Main Title & Subtitle -->
  <g transform="translate(80, 125)">
    <text x="0" y="0" class="title" fill="url(#textGrad)">Awesome Code Coverage &amp; Quality Analytics</text>
    <text x="0" y="38" class="subtitle">Curated Guide to Coverage Reporting, Static Analysis, Quality Gates &amp; SAST</text>
  </g>

  <!-- FOREGROUND CONTENT: Interactive Feature Pills -->
  <g transform="translate(80, 205)">
    <!-- Pill 1: Coverage Engines -->
    <g transform="translate(0, 0)">
      <rect width="185" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="22" cy="19" r="6" fill="#10b981" />
      <text x="38" y="24" class="pill-text">Coverage Engines</text>
    </g>

    <!-- Pill 2: SAST & Linters -->
    <g transform="translate(200, 0)">
      <rect width="165" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="22" cy="19" r="6" fill="#6366f1" />
      <text x="38" y="24" class="pill-text">SAST &amp; Linters</text>
    </g>

    <!-- Pill 3: Quality Gates -->
    <g transform="translate(380, 0)">
      <rect width="165" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="22" cy="19" r="6" fill="#ec4899" />
      <text x="38" y="24" class="pill-text">Quality Gates</text>
    </g>

    <!-- Pill 4: AI Remediation -->
    <g transform="translate(560, 0)">
      <rect width="175" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="22" cy="19" r="6" fill="#f59e0b" />
      <text x="38" y="24" class="pill-text">AI Remediation</text>
    </g>

    <!-- Pill 5: PR Annotations -->
    <g transform="translate(750, 0)">
      <rect width="180" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="22" cy="19" r="6" fill="#06b6d4" />
      <text x="38" y="24" class="pill-text">PR Annotations</text>
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Dynamic Telemetry Cards -->
  <g transform="translate(80, 275)">
    <!-- Card 1: Test Coverage Metric -->
    <g transform="translate(0, 0)">
      <rect width="220" height="95" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <text x="20" y="32" class="metric-label">Target Test Coverage</text>
      <text x="20" y="66" class="metric-value">98.4%</text>
      <path d="M 140 60 L 160 48 L 180 54 L 200 40" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="200" cy="40" r="4" fill="#10b981">
        <animate attributeName="r" values="3;5;3" dur="1.5s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Card 2: Quality Gate Status -->
    <g transform="translate(245, 0)">
      <rect width="220" height="95" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <text x="20" y="32" class="metric-label">Quality Gate</text>
      <text x="20" y="66" class="metric-value" fill="#38bdf8">PASSED</text>
      <!-- Shield Checkmark Icon -->
      <g transform="translate(165, 38)">
        <polygon points="18,0 36,7 36,22 18,34 0,22 0,7" fill="#0284c7" opacity="0.3" />
        <polyline points="10,16 16,22 26,10" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>

    <!-- Card 3: Static Analysis Rule Speed -->
    <g transform="translate(490, 0)">
      <rect width="220" height="95" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <text x="20" y="32" class="metric-label">Analysis Pipeline</text>
      <text x="20" y="66" class="metric-value" fill="#a855f7">10x-100x</text>
      <text x="135" y="66" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#94a3b8">Rust/AST</text>
    </g>

    <!-- Card 4: Open Ecosystem -->
    <g transform="translate(735, 0)">
      <rect width="305" height="95" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <text x="20" y="32" class="metric-label">Ecosystem Directory</text>
      <text x="20" y="66" class="metric-value" fill="#f43f5e">Multi-Lang</text>
      <text x="160" y="66" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#cbd5e1">SaaS &amp; Self-Hosted</text>
    </g>
  </g>

  <!-- Subtle Border Highlight -->
  <rect x="0.5" y="0.5" width="1199" height="419" rx="16" fill="none" stroke="url(#textGrad)" stroke-width="1" opacity="0.4" />
</svg>
